<?xml version="1.0" encoding="UTF-8"?>
<!--
  alle menu-bar template icon — RUNNING (daemon up, per-app routing, no TUN).

  Template image: pure black ink + alpha (NSImage.isTemplate = true). Same A
  silhouette as status-stopped.svg, at full weight, with the three exit nodes
  filled solid — the client is connected to its exits. The mark fills ~70% of
  the canvas to land at ~16pt optical weight at menu-bar height.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="alle — running">
  <title>alle — running</title>
  <g fill="none" stroke="#000000" stroke-width="152"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- the ∀ A: apex (client) at the bottom, two exit tips at the top -->
    <path d="M512 807 L243 243"/>
    <path d="M512 807 L781 243"/>
    <path d="M322 408 L702 408"/>
  </g>
  <!-- exit nodes: solid -->
  <g fill="#000000">
    <circle cx="243" cy="243" r="79"/>
    <circle cx="781" cy="243" r="79"/>
    <circle cx="512" cy="807" r="79"/>
  </g>
</svg>
