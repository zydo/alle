<?xml version="1.0" encoding="UTF-8"?>
<!--
  alle menu-bar template icon — STOPPED (daemon not running).

  Template image: pure black ink + alpha (NSImage.isTemplate = true); macOS
  recolors it to match the menu bar in light/dark. The mark fills ~70% of the
  1024 canvas so that, rendered at menu-bar height (~20pt), it lands near the
  ~16pt optical weight of system status items (Bjango/Apple HIG guidance).

  State language: the stopped state is the *same* glyph as "running" at 35%
  opacity — Apple's standard cue for a disabled/inactive element. Template
  images honor alpha, so the whole mark dims uniformly and snaps to full
  strength when the daemon is up.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="alle — not running">
  <title>alle — not running</title>
  <g opacity="0.35">
    <g fill="none" stroke="#000000" stroke-width="152"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- the ∀ A: apex (client) at the bottom, two exit tips at the top -->
      <path d="M512 807 L243 243"/>
      <path d="M512 807 L781 243"/>
      <path d="M322 408 L702 408"/>
    </g>
    <!-- exit nodes: solid (dimmed with the group) -->
    <g fill="#000000">
      <circle cx="243" cy="243" r="79"/>
      <circle cx="781" cy="243" r="79"/>
      <circle cx="512" cy="807" r="79"/>
    </g>
  </g>
</svg>
